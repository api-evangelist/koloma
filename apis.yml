aid: koloma
name: Koloma
description: 'Koloma is a Denver, Colorado based natural (geologic) hydrogen exploration
  and production company founded in 2021 by Pete Johnson and Tom Darrah, PhD, with
  a research laboratory in Columbus, Ohio. The company applies subsurface geoscience,
  proprietary data and data-driven exploration methods — airborne geophysics, passive
  acoustic and magnetotelluric surveys, and lab characterization of rock, liquid and
  gas samples — to locate and produce naturally occurring hydrogen generated by serpentinization
  deep within the Earth. Koloma operates in the United States and internationally,
  including Koloma Australia and exploration operations in the Philippines, and is
  backed by Amazon Climate Pledge Fund, Breakthrough Energy Ventures, Khosla Ventures,
  Mitsubishi Heavy Industries and United Airlines. Koloma publishes no public developer
  platform, API documentation or SDKs; its only machine-readable agent surface found
  in this pass is a Wix-platform Model Context Protocol endpoint plus an llms.txt served
  from the Koloma California regional site.'
