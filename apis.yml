apis:
- aid: koloma:koloma-california-site-mcp
  name: Koloma California Site MCP
  description: 'A Model Context Protocol (MCP) endpoint served from the Koloma California
    regional website at https://www.kolomacalifornia.com/_api/mcp and advertised in
    that host''s own llms.txt. The endpoint is provided by the Wix site platform rather
    than authored by Koloma, but it is served from Koloma''s host and self-identifies
    as "Koloma California". An anonymous tools/list returns nine tools covering site
    search, business details, visitor-token issuance, Wix REST documentation lookup,
    and authenticated calls into the Wix site APIs. This is the only machine-readable
    API surface Koloma exposes; there is no first-party Koloma subsurface, exploration
    or hydrogen data API.'
