tools:
- name: GetBusinessDetails
  description: Returns business and site details (timezone, email, phone, fax, address,
    site/business name, description, business schedule) plus which Wix site features
    are installed.
  input_schema: {}
  read_only: true
- name: SearchInSite
  description: Full-text search of the Koloma California site content.
  input_schema:
    searchTerm: string (required)
  read_only: true
- name: SearchSiteApiDocs
  description: Searches the Wix API documentation for the business solutions installed
    on this site and returns usage instructions.
  input_schema:
    searchTerm: string (required)
  read_only: true
- name: GenerateVisitorToken
  description: Creates a new visitor session and returns a visitor access token, required
    before any CallWixSiteAPI/ExecuteWixAPI request.
  input_schema: {}
  read_only: false
- name: CallWixSiteAPI
  description: Performs a single HTTP call against a Wix site API method on the visitor's
    behalf.
  input_schema:
    visitorToken: string (required)
    url: string uri (required)
    method: string (required)
    body: string JSON (optional)
  read_only: false
- name: ExecuteWixAPI
  description: Runs a sandboxed JavaScript async function against the Wix REST API
    on the visitor's behalf, allowing chained/paginated calls in one step.
  input_schema:
    code: string (required)
    reason: string (required)
    hasMutations: boolean (required)
    sourceDocUrls: array of string (required)
    visitorToken: string (optional)
  read_only: false
  destructive_hint: true
- name: BrowseWixRESTDocsMenu
  description: Browse the Wix REST API documentation menu hierarchy.
  input_schema:
    menuUrl: string (optional)
    reason: string (required)
  read_only: true
- name: ReadFullDocsArticle
  description: Fetches a complete article from the Wix developer documentation portal.
  input_schema:
    articleUrl: string uri (required)
  read_only: true
- name: ReadFullDocsMethodSchema
  description: Fetches the full request/response schema for a Wix API method.
  input_schema:
    articleUrl: string uri (required)
    reason: string (required)
  read_only: true
